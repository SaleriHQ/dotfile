# Font Configuration
font_family VictorMono Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 14

modify_font cell_width +1px
modify_font cell_height +6px

symbol_map U+E000-U+F8FF VictorMono Nerd Font

symbol_map U+2E80-U+2EFF,U+2F00-U+2FDF,U+3000-U+303F,U+31C0-U+31EF,U+3400-U+4DBF,U+4E00-U+9FFF,U+F900-U+FAFF,U+FF00-U+FFEF HarmonyOS Sans SC

disable_ligatures cursor

# Window Configuration
window_padding_width 12
background_opacity 0.8
background_blur 32
hide_window_decorations yes

# Cursor Configuration
cursor_shape block
cursor_blink_interval 1

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

enabled_layouts splits:equalize_on_close=true

map ctrl+shift+enter launch --location=vsplit
map ctrl+shift+s launch --location=split

map ctrl+shift+h  neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k    neighboring_window up
map ctrl+shift+j  neighboring_window down

map ctrl+shift+left  resize_window narrower
map ctrl+shift+right resize_window wider
map ctrl+shift+up    resize_window taller
map ctrl+shift+down  resize_window shorter

map ctrl+shift+e layout_action equalize
map ctrl+shift+x close_window

map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Tab configuration
tab_bar_style powerline
tab_bar_align left

# Shell integration
shell_integration enabled

# Dank color generation
include dank-tabs.conf
include dank-theme.conf


# BEGIN_KITTY_THEME
# Noctalia
include current-theme.conf
# END_KITTY_THEME
